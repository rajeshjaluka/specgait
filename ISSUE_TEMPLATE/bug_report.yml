name: "🐛 Bug Report"
description: File a reproducible problem
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this issue!
  - type: input
    id: version
    attributes:
      label: Version
      description: What version or commit hash are you using?
      placeholder: "e.g., v1.0.2"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step reproduction instructions.
      placeholder: |
        1. Run '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Self-checks
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
